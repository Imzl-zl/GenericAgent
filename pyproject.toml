# AI install hint: choose deps by OS/env + needed ui/bot. do NOT install all.
# minimal core first; missing packages can be installed on demand.

[project]
name = "genericagent"
version = "0.1.0"
description = "Minimalist self-evolving autonomous agent framework"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "bottle>=0.12",
    "simple-websocket-server>=0.4",
    "aiohttp>=3.9",
    # IM 媒体适配硬依赖(2026-08-16 从 ui extra 移入): frontends/wxbot_client
    # fit_image_for_upload 与 bot_poller 图片压缩均运行时依赖, 与 UI 无关;
    # 原先只挂 ui extra 导致 CI/新部署缺 PIL 静默回退原图(2026-08-14 事故
    # 复发风险)。全平台有 wheel。
    "pillow>=9.0",
]

[project.optional-dependencies]
# select extras, not all. match current task/env.
# examples: .[ui] for GUI, bot deps only if bot needed.
ui = [
    "streamlit>=1.28",
    "pywebview>=4.0",
    "textual>=0.70",
    # tui_v3 (scrollback-first TUI) — prompt_toolkit replaces textual; rich is
    # now a direct dependency (was transitive via textual in tui_v2).
    "prompt_toolkit>=3.0,<4",
    "rich>=13.0",
]
all-frontends = [
    "python-telegram-bot>=20.0",
    "qq-botpy>=1.0",
    "pycryptodome>=3.19",
    "qrcode>=7.4",
    "lark-oapi>=1.7",
    "wecom-aibot-sdk>=1.0",
    "dingtalk-stream>=0.20",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
packages = ["ga_cli"]

[project.scripts]
ga = "ga_cli.cli:main"