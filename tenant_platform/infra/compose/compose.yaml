name: genericagent

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: ${GA_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    user: "70:70"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=70,gid=70,mode=0700
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=70,gid=70,mode=0770
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${GA_POSTGRES_BIND:-127.0.0.1}:${GA_POSTGRES_PORT:-55432}:5432"
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 60s
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    logging: *default-logging

  bot-poller:
    image: ${GA_BOT_POLLER_IMAGE:-genericagent-bot-poller:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/bot-poller.Dockerfile
    restart: unless-stopped
    user: "10002:10002"
    group_add:
      - "10003"
    environment:
      BOT_POLLER_LISTEN: ${BOT_POLLER_LISTEN}
      BOT_POLLER_MEDIA_DIR: ${BOT_POLLER_MEDIA_DIR}
      BOT_POLLER_API_SECRET: ${BOT_POLLER_API_SECRET}
      PLATFORM_WEBHOOK_SECRET: ${PLATFORM_WEBHOOK_SECRET}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10002,gid=10002,mode=0700
    volumes:
      - bot_media:/var/lib/ga/bot-media
      - session_files:/var/lib/ga/runtime/session_files:ro
    networks:
      - application
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 30s
    logging: *default-logging

  platform:
    image: ${GA_PLATFORM_IMAGE:-genericagent-platform:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/platform.Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    group_add:
      - "10003"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BOT_TOKEN_KEY: ${BOT_TOKEN_KEY}
      BOT_POLLER_URL: ${BOT_POLLER_URL}
      BOT_POLLER_API_SECRET: ${BOT_POLLER_API_SECRET}
      PLATFORM_WEBHOOK_URL: ${PLATFORM_WEBHOOK_URL}
      PLATFORM_WEBHOOK_SECRET: ${PLATFORM_WEBHOOK_SECRET}
      PLATFORM_DEV_TOKEN: ${PLATFORM_DEV_TOKEN}
      PLATFORM_DEV_USER_ID: ${PLATFORM_DEV_USER_ID}
      PLATFORM_DEV_USERNAME: ${PLATFORM_DEV_USERNAME}
      LLM_PROXY_CAPABILITY_SIGNING_KEY: ${LLM_PROXY_CAPABILITY_SIGNING_KEY}
      GA_RUNTIME_DIR: ${GA_RUNTIME_DIR}
      GA_CONFIG_ROOT: ${GA_CONFIG_ROOT}
      GA_LEGACY_ROOT: ${GA_LEGACY_ROOT}
      GA_WORKER_PYTHON: ${GA_WORKER_PYTHON}
      GA_WORKER_SRC: ${GA_WORKER_SRC}
      GA_MIGRATIONS_DIR: ${GA_MIGRATIONS_DIR}
      GA_WORKER_EXECUTION_MODE: ${GA_WORKER_EXECUTION_MODE:-user_workspace_runner}
      GA_RUNNER_MAX_ACTIVE: ${GA_RUNNER_MAX_ACTIVE:-4}
      GA_LLM_PROXY_ADDR: ${GA_LLM_PROXY_ADDR:-http://llm-proxy:8081}
      GA_RUNNER_IDLE_TTL: ${GA_RUNNER_IDLE_TTL:-30m}
      PER_TENANT_RUNNING_LIMIT: ${PER_TENANT_RUNNING_LIMIT}
      PER_USER_QUEUE_LIMIT: ${PER_USER_QUEUE_LIMIT}
      TASK_IDLE_TIMEOUT_SECONDS: ${TASK_IDLE_TIMEOUT_SECONDS}
      # 单任务硬性时长上限(原 GA_RUNNER_TASK_TIMEOUT, 审查 M12: 语义属 Platform)
      TASK_TIMEOUT_SECONDS: ${GA_RUNNER_TASK_TIMEOUT:-300}
      WORKER_IDLE_TTL_SECONDS: ${WORKER_IDLE_TTL_SECONDS}
      # 生产 Runner 控制面(方案 §7): Platform 经认证 Manager API 操作容器。
      GA_WORKSPACES_ROOT: /var/lib/ga/workspaces
      GA_MANAGER_ADDR: ${GA_MANAGER_ADDR:-http://sandbox-manager:8091}
      GA_MANAGER_SECRET: ${GA_MANAGER_SECRET}
      GA_RUNNER_IMAGE: ${GA_RUNNER_IMAGE:-ga-runner:local}
      GA_MEMORY_TEMPLATE: ${GA_MEMORY_TEMPLATE:-/ga/memory-template}
      GA_SOPHUB_PROXY_ADDR: ${GA_SOPHUB_PROXY_ADDR:-http://platform:8080}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700
    volumes:
      - platform_runtime:/var/lib/ga/runtime
      - session_files:/var/lib/ga/runtime/session_files
      - platform_config:/etc/ga/config
      - bot_media:/var/lib/ga/bot-media:ro
      # 共享工作区卷: 附件/输出经 temp/ 与 Runner 互通(方案 §6)。
      - runner_workspaces:/var/lib/ga/workspaces
    ports:
      - "${GA_HTTP_BIND:-127.0.0.1}:${GA_HTTP_PORT:-8088}:8088"
    networks:
      - application
      - database
      - runner-control
    depends_on:
      postgres:
        condition: service_healthy
      bot-poller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 45s
    logging: *default-logging

  llm-proxy:
    image: ${GA_LLM_PROXY_IMAGE:-genericagent-llm-proxy:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/llm-proxy.Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LLM_PROXY_CAPABILITY_SIGNING_KEY: ${LLM_PROXY_CAPABILITY_SIGNING_KEY}
      LLM_PROXY_LISTEN: ${LLM_PROXY_LISTEN:-0.0.0.0:8081}
      # 解密 provider API key 的 AES-256-GCM 密钥(审查 C2: 缺失则启动必失败)。
      # 留空时回退 BOT_TOKEN_KEY —— Platform 用 BOT_TOKEN_KEY 加密 provider key。
      LLM_PROVIDER_KEY: ${LLM_PROVIDER_KEY:-}
      BOT_TOKEN_KEY: ${BOT_TOKEN_KEY:-}
      # 受控 egress allowlist: 留空时仅允许公网 unicast 地址(默认);
      # 生产建议配置为实际 Provider 出口 CIDR/域名。
      LLM_PROXY_ALLOWED_UPSTREAM_CIDRS: ${LLM_PROXY_ALLOWED_UPSTREAM_CIDRS:-}
      LLM_PROXY_ALLOW_HTTP_HOSTS: ${LLM_PROXY_ALLOW_HTTP_HOSTS:-}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
    networks:
      - database
      - runner-control
      # 唯一持有出站能力的服务: 仅 llm-proxy 接入 llm-egress 网络(审查 C2),
      # Runner/Platform 保持 internal-only。
      - llm-egress
    depends_on:
      postgres:
        condition: service_healthy
    # 内部服务: 不映射宿主机端口; runner-control/database internal + llm-egress。
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 30s
    logging: *default-logging

  # Sandbox Manager: 唯一可访问 Docker socket 的组件(方案 §7)。
  # ga-runner 不是常驻服务, 由 Manager 按工作区活跃状态动态创建。
  sandbox-manager:
    image: ${GA_SANDBOX_MANAGER_IMAGE:-genericagent-sandbox-manager:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/sandbox-manager.Dockerfile
    restart: unless-stopped
    init: true
    # root 运行: 需要 chown 工作区目录(固定 Runner UID/GID)与访问 Docker socket;
    # 仍受 read_only + cap_drop ALL + no-new-privileges 约束, 仅追加最小能力。
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    environment:
      GA_RUNNER_IMAGE: ${GA_RUNNER_IMAGE:-ga-runner:local}
      # fail-closed(审查): 默认拒绝可变 tag。本地开发需在 .env 显式设
      # GA_RUNNER_ALLOW_TAG=1 或改用 @sha256: digest 镜像; 生产禁止 tag。
      GA_RUNNER_ALLOW_TAG: ${GA_RUNNER_ALLOW_TAG:-0}
      GA_RUNNER_SHARE_GID: ${GA_RUNNER_SHARE_GID:-10003}
      GA_RUNNER_SECURITY_PROFILE: ${GA_RUNNER_SECURITY_PROFILE:-}
      # fail-closed(审查): 生产(不可信 Runner)必须设 GA_RUNNER_SECURITY_PROFILE=runsc;
      # 未设置时 sandbox-manager 拒绝启动, 除非本地开发显式设 GA_RUNNER_ALLOW_RUNC=1。
      GA_RUNNER_ALLOW_RUNC: ${GA_RUNNER_ALLOW_RUNC:-0}
      GA_RUNNER_IDLE_TTL: ${GA_RUNNER_IDLE_TTL:-30m}
      GA_RUNNER_MEMORY_BYTES: ${GA_RUNNER_MEMORY_BYTES:-1073741824}
      GA_RUNNER_CPU_QUOTA: ${GA_RUNNER_CPU_QUOTA:-100000}
      GA_RUNNER_PIDS_LIMIT: ${GA_RUNNER_PIDS_LIMIT:-128}
      GA_WORKSPACES_ROOT: ${GA_WORKSPACES_ROOT:-/var/lib/ga/workspaces}
      GA_WORKSPACES_VOLUME: ${GA_WORKSPACES_VOLUME:-runner_workspaces}
      GA_MANAGER_SECRET: ${GA_MANAGER_SECRET}
      GA_MANAGER_ID: ${GA_MANAGER_ID:-sandbox-manager-1}
      GA_MEMORY_TEMPLATE: ${GA_MEMORY_TEMPLATE:-/ga/memory-template}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=0700
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner_workspaces:/var/lib/ga/workspaces
    networks:
      - application
      - runner-control
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 30s
    logging: *default-logging

  web:
    image: ${GA_WEB_IMAGE:-genericagent-web:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/web.Dockerfile
    restart: unless-stopped
    user: "101:101"
    network_mode: service:platform
    depends_on:
      platform:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=101,gid=101,mode=0700
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8088/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 15s
    logging: *default-logging

  # ga-runner 镜像构建入口(方案 §8): scale: 0 使 `docker compose up -d --build`
  # 构建镜像但不启动容器(审查: 单命令部署必须包含 Runner 镜像构建)。
  # 容器实例由 Sandbox Manager 按工作区活跃状态动态创建。
  ga-runner:
    image: ${GA_RUNNER_IMAGE:-ga-runner:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/ga-runner.Dockerfile
    scale: 0
    restart: "no"
    entrypoint: ["true"]
    logging: *default-logging

volumes:
  postgres_data:
  platform_runtime:
  platform_config:
  session_files:
  bot_media:
  # 显式卷名: sandbox-manager 用 volume-subpath 挂载子目录到 Runner(daemon 可解析)。
  runner_workspaces:
    name: runner_workspaces

networks:
  application:
  database:
    internal: true
  runner-control:
    internal: true
    name: runner-control
  # llm-proxy 专有的出站网络(审查 C2): 非 internal, 供代理访问上游
  # LLM Provider; Runner 不接入, 保持 internal-only。
  llm-egress:
    name: llm-egress
