name: genericagent

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: ${GA_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: "no"
    user: "70:70"
    env_file:
      - ./secrets/postgres.env
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=70,gid=70,mode=0700
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=70,gid=70,mode=0770
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${GA_POSTGRES_BIND:-127.0.0.1}:${GA_POSTGRES_PORT:-55432}:5432"
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 60s
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    logging: *default-logging

  bot-poller:
    image: ${GA_BOT_POLLER_IMAGE:-genericagent-bot-poller:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/bot-poller.Dockerfile
    restart: "no"
    user: "10002:10002"
    group_add:
      - "10003"
    env_file:
      - ./secrets/bot-poller.env
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10002,gid=10002,mode=0700
    volumes:
      - bot_media:/var/lib/ga/bot-media
      - session_files:/var/lib/ga/runtime/session_files:ro
    networks:
      - application
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 30s
    logging: *default-logging

  platform:
    image: ${GA_PLATFORM_IMAGE:-genericagent-platform:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/platform.Dockerfile
    restart: "no"
    init: true
    user: "10001:10001"
    group_add:
      - "10003"
    env_file:
      - ./secrets/platform.env
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700
    volumes:
      - platform_runtime:/var/lib/ga/runtime
      - session_files:/var/lib/ga/runtime/session_files
      - platform_config:/etc/ga/config
      - bot_media:/var/lib/ga/bot-media:ro
    ports:
      - "${GA_HTTP_BIND:-127.0.0.1}:${GA_HTTP_PORT:-8088}:8088"
    networks:
      - application
      - database
    depends_on:
      postgres:
        condition: service_healthy
      bot-poller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 45s
    logging: *default-logging

  web:
    image: ${GA_WEB_IMAGE:-genericagent-web:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/web.Dockerfile
    restart: "no"
    user: "101:101"
    network_mode: service:platform
    depends_on:
      platform:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=101,gid=101,mode=0700
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8088/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 15s
    logging: *default-logging

volumes:
  postgres_data:
  platform_runtime:
  platform_config:
  session_files:
  bot_media:

networks:
  application:
  database:
    internal: true
