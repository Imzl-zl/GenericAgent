name: genericagent

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: ${GA_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    user: "70:70"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=70,gid=70,mode=0700
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=70,gid=70,mode=0770
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${GA_POSTGRES_BIND:-127.0.0.1}:${GA_POSTGRES_PORT:-55432}:5432"
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 60s
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    logging: *default-logging

  bot-poller:
    image: ${GA_BOT_POLLER_IMAGE:-genericagent-bot-poller:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/bot-poller.Dockerfile
    restart: unless-stopped
    user: "10002:10002"
    group_add:
      - "10003"
    environment:
      BOT_POLLER_LISTEN: ${BOT_POLLER_LISTEN}
      BOT_POLLER_MEDIA_DIR: ${BOT_POLLER_MEDIA_DIR}
      BOT_POLLER_API_SECRET: ${BOT_POLLER_API_SECRET}
      PLATFORM_WEBHOOK_SECRET: ${PLATFORM_WEBHOOK_SECRET}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10002,gid=10002,mode=0700
    volumes:
      - bot_media:/var/lib/ga/bot-media
      - session_files:/var/lib/ga/runtime/session_files:ro
    networks:
      - application
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 30s
    logging: *default-logging

  platform:
    image: ${GA_PLATFORM_IMAGE:-genericagent-platform:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/platform.Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    group_add:
      - "10003"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BOT_TOKEN_KEY: ${BOT_TOKEN_KEY}
      BOT_POLLER_URL: ${BOT_POLLER_URL}
      BOT_POLLER_API_SECRET: ${BOT_POLLER_API_SECRET}
      PLATFORM_WEBHOOK_URL: ${PLATFORM_WEBHOOK_URL}
      PLATFORM_WEBHOOK_SECRET: ${PLATFORM_WEBHOOK_SECRET}
      PLATFORM_DEV_TOKEN: ${PLATFORM_DEV_TOKEN}
      PLATFORM_DEV_USER_ID: ${PLATFORM_DEV_USER_ID}
      PLATFORM_DEV_USERNAME: ${PLATFORM_DEV_USERNAME}
      LLM_PROXY_CAPABILITY_SIGNING_KEY: ${LLM_PROXY_CAPABILITY_SIGNING_KEY}
      GA_RUNTIME_DIR: ${GA_RUNTIME_DIR}
      GA_CONFIG_ROOT: ${GA_CONFIG_ROOT}
      GA_LEGACY_ROOT: ${GA_LEGACY_ROOT}
      GA_WORKER_PYTHON: ${GA_WORKER_PYTHON}
      GA_WORKER_SRC: ${GA_WORKER_SRC}
      GA_MIGRATIONS_DIR: ${GA_MIGRATIONS_DIR}
      DOCUMENT_GATEWAY_BASE_URL: ${DOCUMENT_GATEWAY_BASE_URL}
      DOCUMENT_POOL_MAX_ACTIVE_HARD: ${DOCUMENT_POOL_MAX_ACTIVE_HARD}
      MAX_RUNNING_TASKS: ${MAX_RUNNING_TASKS}
      PER_TENANT_RUNNING_LIMIT: ${PER_TENANT_RUNNING_LIMIT}
      PER_USER_QUEUE_LIMIT: ${PER_USER_QUEUE_LIMIT}
      TASK_IDLE_TIMEOUT_SECONDS: ${TASK_IDLE_TIMEOUT_SECONDS}
      WORKER_IDLE_TTL_SECONDS: ${WORKER_IDLE_TTL_SECONDS}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700
    volumes:
      - platform_runtime:/var/lib/ga/runtime
      - session_files:/var/lib/ga/runtime/session_files
      - platform_config:/etc/ga/config
      - bot_media:/var/lib/ga/bot-media:ro
    ports:
      - "${GA_HTTP_BIND:-127.0.0.1}:${GA_HTTP_PORT:-8088}:8088"
    networks:
      - application
      - database
    depends_on:
      postgres:
        condition: service_healthy
      bot-poller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 45s
    logging: *default-logging

  document-manager:
    image: ${GA_DOCUMENT_MANAGER_IMAGE:-genericagent-document-manager:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/document-manager.Dockerfile
    restart: unless-stopped
    init: true
    user: "0:0"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GA_MIGRATIONS_DIR: ${GA_MIGRATIONS_DIR}
      DOCUMENT_MANAGER_OWNER: ${DOCUMENT_MANAGER_OWNER}
      DOCUMENT_MANAGER_WORK_ROOT: ${DOCUMENT_MANAGER_WORK_ROOT}
      DOCUMENT_MANAGER_RUNTIME_BINARY: ${DOCUMENT_MANAGER_RUNTIME_BINARY}
      DOCUMENT_MANAGER_IMAGE: ${DOCUMENT_MANAGER_IMAGE}
      DOCUMENT_MANAGER_ALLOW_ROOTFUL_RUNTIME: ${DOCUMENT_MANAGER_ALLOW_ROOTFUL_RUNTIME}
      DOCUMENT_MANAGER_ALLOW_MUTABLE_IMAGE: ${DOCUMENT_MANAGER_ALLOW_MUTABLE_IMAGE}
      DOCUMENT_MANAGER_SECCOMP_PROFILE: ${DOCUMENT_MANAGER_SECCOMP_PROFILE}
      DOCUMENT_MANAGER_UID: ${DOCUMENT_MANAGER_UID}
      DOCUMENT_MANAGER_GID: ${DOCUMENT_MANAGER_GID}
      DOCUMENT_MANAGER_MEMORY_BYTES: ${DOCUMENT_MANAGER_MEMORY_BYTES}
      DOCUMENT_MANAGER_CPU_PERIOD: ${DOCUMENT_MANAGER_CPU_PERIOD}
      DOCUMENT_MANAGER_CPU_QUOTA: ${DOCUMENT_MANAGER_CPU_QUOTA}
      DOCUMENT_MANAGER_PIDS_LIMIT: ${DOCUMENT_MANAGER_PIDS_LIMIT}
      DOCUMENT_MANAGER_TMPFS_BYTES: ${DOCUMENT_MANAGER_TMPFS_BYTES}
      DOCUMENT_POOL_MAX_ACTIVE_HARD: ${DOCUMENT_POOL_MAX_ACTIVE_HARD}
      DOCUMENT_MANAGER_CLAIM_LEASE: ${DOCUMENT_MANAGER_CLAIM_LEASE}
      DOCUMENT_MANAGER_HEARTBEAT_INTERVAL: ${DOCUMENT_MANAGER_HEARTBEAT_INTERVAL}
      DOCUMENT_MANAGER_POLL_INTERVAL: ${DOCUMENT_MANAGER_POLL_INTERVAL}
      DOCUMENT_MANAGER_COMMAND_POLL_INTERVAL: ${DOCUMENT_MANAGER_COMMAND_POLL_INTERVAL}
      DOCUMENT_MANAGER_SHUTDOWN_TIMEOUT: ${DOCUMENT_MANAGER_SHUTDOWN_TIMEOUT}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - document_work:/var/lib/ga/documents
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 30s
    logging: *default-logging

  web:
    image: ${GA_WEB_IMAGE:-genericagent-web:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/web.Dockerfile
    restart: unless-stopped
    user: "101:101"
    network_mode: service:platform
    depends_on:
      platform:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=101,gid=101,mode=0700
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8088/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 15s
    logging: *default-logging

volumes:
  postgres_data:
  platform_runtime:
  platform_config:
  session_files:
  bot_media:
  document_work:

networks:
  application:
  database:
    internal: true
