name: genericagent

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: ${GA_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    user: "70:70"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=70,gid=70,mode=0700
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=70,gid=70,mode=0770
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${GA_POSTGRES_BIND:-127.0.0.1}:${GA_POSTGRES_PORT:-55432}:5432"
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 60s
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    logging: *default-logging

  bot-poller:
    image: ${GA_BOT_POLLER_IMAGE:-genericagent-bot-poller:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/bot-poller.Dockerfile
    restart: unless-stopped
    user: "10002:10002"
    group_add:
      - "10003"
    environment:
      BOT_POLLER_LISTEN: ${BOT_POLLER_LISTEN}
      BOT_POLLER_MEDIA_DIR: ${BOT_POLLER_MEDIA_DIR}
      BOT_POLLER_API_SECRET: ${BOT_POLLER_API_SECRET}
      PLATFORM_WEBHOOK_SECRET: ${PLATFORM_WEBHOOK_SECRET}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10002,gid=10002,mode=0700
    volumes:
      - bot_media:/var/lib/ga/bot-media
      - session_files:/var/lib/ga/runtime/session_files:ro
      # round9 审查: 交付 spool 共享卷(Poller 只读)——Platform 写入的
      # 文件快照在此被 Poller 直接读取, 与 Platform 私有 /tmp 隔离。
      - delivery_spool:/var/lib/ga/delivery-spool:ro
    networks:
      - application
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 30s
    logging: *default-logging

  platform:
    image: ${GA_PLATFORM_IMAGE:-genericagent-platform:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/platform.Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    group_add:
      - "10003"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BOT_TOKEN_KEY: ${BOT_TOKEN_KEY}
      # 微信绑定(iLink)开关: 空值 = 禁用微信 QR 绑定路由(注册时会 404)。
      # 官方网关 https://ilinkai.weixin.qq.com (与 GA Core wxbot_client 一致);
      # 自建 iLink 网关可覆盖。启用时要求 BOT_TOKEN_KEY 非空。
      ILINK_BASE_URL: ${ILINK_BASE_URL:-}
      ILINK_APP_ID: ${ILINK_APP_ID:-bot}
      ILINK_CLIENT_VERSION: ${ILINK_CLIENT_VERSION:-2.1.1}
      BOT_POLLER_URL: ${BOT_POLLER_URL}
      BOT_POLLER_API_SECRET: ${BOT_POLLER_API_SECRET}
      PLATFORM_WEBHOOK_URL: ${PLATFORM_WEBHOOK_URL}
      PLATFORM_WEBHOOK_SECRET: ${PLATFORM_WEBHOOK_SECRET}
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN}
      PLATFORM_ADMIN_USER_ID: ${PLATFORM_ADMIN_USER_ID}
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME}
      LLM_PROXY_CAPABILITY_SIGNING_KEY: ${LLM_PROXY_CAPABILITY_SIGNING_KEY}
      GA_RUNTIME_DIR: ${GA_RUNTIME_DIR}
      GA_CONFIG_ROOT: ${GA_CONFIG_ROOT}
      GA_LEGACY_ROOT: ${GA_LEGACY_ROOT}
      GA_WORKER_PYTHON: ${GA_WORKER_PYTHON}
      GA_WORKER_SRC: ${GA_WORKER_SRC}
      GA_MIGRATIONS_DIR: ${GA_MIGRATIONS_DIR}
      GA_WORKER_EXECUTION_MODE: ${GA_WORKER_EXECUTION_MODE:-user_workspace_runner}
      GA_RUNNER_MAX_ACTIVE: ${GA_RUNNER_MAX_ACTIVE:-4}
      GA_LLM_PROXY_ADDR: ${GA_LLM_PROXY_ADDR:-http://llm-proxy:8081}
      GA_RUNNER_IDLE_TTL: ${GA_RUNNER_IDLE_TTL:-30m}
      PER_REQUESTER_RUNNING_LIMIT: ${PER_REQUESTER_RUNNING_LIMIT}
      PER_USER_QUEUE_LIMIT: ${PER_USER_QUEUE_LIMIT}
      TASK_IDLE_TIMEOUT_SECONDS: ${TASK_IDLE_TIMEOUT_SECONDS}
      # 单任务硬性时长上限(原 GA_RUNNER_TASK_TIMEOUT, 审查 M12: 语义属 Platform)
      TASK_TIMEOUT_SECONDS: ${GA_RUNNER_TASK_TIMEOUT:-300}
      # 生产 Runner 控制面(方案 §7): Platform 经认证 Manager API 操作容器。
      GA_WORKSPACES_ROOT: /var/lib/ga/workspaces
      GA_MANAGER_ADDR: ${GA_MANAGER_ADDR:-http://sandbox-manager:8091}
      GA_MANAGER_SECRET: ${GA_MANAGER_SECRET}
      GA_RUNNER_IMAGE: ${GA_RUNNER_IMAGE:-ga-runner:local}
      GA_MEMORY_TEMPLATE: ${GA_MEMORY_TEMPLATE:-/ga/memory-template}
      GA_SOPHUB_PROXY_ADDR: ${GA_SOPHUB_PROXY_ADDR:-http://platform:8082}
      # round9 审查: task 去重唯一键依赖稳定 source_instance_id; 单实例部署
      # 固定该值, 重启后 Poller 重试的同一消息命中唯一键, 不产生重复任务。
      GA_PLATFORM_INSTANCE_ID: ${GA_PLATFORM_INSTANCE_ID:-platform-1}
      # Round8 审查: 入站 media_paths 必须位于该根内(Poller 被攻破时防任意文件读取)。
      # 与 bot-poller 的 BOT_POLLER_MEDIA_DIR 共用同一配置源, 避免两处不一致
      # 导致所有媒体消息 fail-closed 拒绝。
      GA_BOT_MEDIA_ROOT: ${BOT_POLLER_MEDIA_DIR:-/var/lib/ga/bot-media}
      # round9 审查: 交付 spool 目录(与卷挂载一致, 见 volumes)。
      GA_DELIVERY_SPOOL_DIR: /var/lib/ga/delivery-spool
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700
    volumes:
      - platform_runtime:/var/lib/ga/runtime
      - session_files:/var/lib/ga/runtime/session_files
      - platform_config:/etc/ga/config
      # round10 审查(B1c)接线修复: Platform 必须把 unix socket 所在目录挂到
      # 与 web 共享的 platform_sock 卷, 否则只读根下 /var/run/ga 无法创建 socket。
      - platform_sock:/var/run/ga
      - bot_media:/var/lib/ga/bot-media:ro
      # 共享工作区卷: 附件/输出经 temp/ 与 Runner 互通(方案 §6)。
      - runner_workspaces:/var/lib/ga/workspaces
      # round9 审查: 交付 spool(Platform 可写, Poller 只读)。
      - delivery_spool:/var/lib/ga/delivery-spool
    networks:
      - application
      - database
      - runner-control
    depends_on:
      postgres:
        condition: service_healthy
      bot-poller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 45s
    logging: *default-logging

  llm-proxy:
    image: ${GA_LLM_PROXY_IMAGE:-genericagent-llm-proxy:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/llm-proxy.Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LLM_PROXY_CAPABILITY_SIGNING_KEY: ${LLM_PROXY_CAPABILITY_SIGNING_KEY}
      LLM_PROXY_LISTEN: ${LLM_PROXY_LISTEN:-0.0.0.0:8081}
      # 解密 provider API key 的 AES-256-GCM 密钥(审查 C2: 缺失则启动必失败)。
      # 留空时回退 BOT_TOKEN_KEY —— Platform 用 BOT_TOKEN_KEY 加密 provider key。
      LLM_PROVIDER_KEY: ${LLM_PROVIDER_KEY:-}
      BOT_TOKEN_KEY: ${BOT_TOKEN_KEY:-}
      # 受控 egress allowlist: 留空时仅允许公网 unicast 地址(默认);
      # 生产建议配置为实际 Provider 出口 CIDR/域名。
      LLM_PROXY_ALLOWED_UPSTREAM_CIDRS: ${LLM_PROXY_ALLOWED_UPSTREAM_CIDRS:-}
      LLM_PROXY_ALLOW_HTTP_HOSTS: ${LLM_PROXY_ALLOW_HTTP_HOSTS:-}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
    networks:
      - database
      - runner-control
      # 唯一持有出站能力的服务: 仅 llm-proxy 接入 llm-egress 网络(审查 C2),
      # Runner/Platform 保持 internal-only。
      - llm-egress
    depends_on:
      postgres:
        condition: service_healthy
    # 内部服务: 不映射宿主机端口; runner-control/database internal + llm-egress。
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 30s
    logging: *default-logging

  # Sandbox Manager: 唯一可访问 Docker socket 的组件(方案 §7)。
  # ga-runner 不是常驻服务, 由 Manager 按工作区活跃状态动态创建。
  sandbox-manager:
    image: ${GA_SANDBOX_MANAGER_IMAGE:-genericagent-sandbox-manager:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/sandbox-manager.Dockerfile
    restart: unless-stopped
    init: true
    # root 运行: 需要 chown 工作区目录(固定 Runner UID/GID)与访问 Docker socket;
    # 仍受 read_only + cap_drop ALL + no-new-privileges 约束, 仅追加最小能力。
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      # 审查 R5-C2: 预置 workspace 需要 chown 到 Runner UID/GID 后保留
      # setgid 位——Fchown 后目录属主已不是 root, 无 CAP_FOWNER 时 Fchmod
      # 直接 EPERM; 仅 FOWNER 仍会因缺 CAP_FSETID 清除非属主组的 setgid
      # (实测: FOWNER 得 0770, 加 FSETID 才得 02770)。
      - FOWNER
      - FSETID
    security_opt:
      - no-new-privileges:true
    environment:
      GA_RUNNER_IMAGE: ${GA_RUNNER_IMAGE:-ga-runner:local}
      # round11 M2: 内部网络带项目名前缀, manager 必须按实际网络名创建 Runner。
      GA_RUNNER_NETWORK: ${GA_RUNNER_NETWORK:-${COMPOSE_PROJECT_NAME:-ga}_runner-control}
      # fail-closed(审查): 默认拒绝可变 tag。本地开发需在 .env 显式设
      # GA_RUNNER_ALLOW_TAG=1 或改用 @sha256: digest 镜像; 生产禁止 tag。
      GA_RUNNER_ALLOW_TAG: ${GA_RUNNER_ALLOW_TAG:-0}
      GA_RUNNER_SHARE_GID: ${GA_RUNNER_SHARE_GID:-10003}
      GA_RUNNER_SECURITY_PROFILE: ${GA_RUNNER_SECURITY_PROFILE:-}
      # fail-closed(审查): 生产(不可信 Runner)必须设 GA_RUNNER_SECURITY_PROFILE=runsc;
      # 未设置时 sandbox-manager 拒绝启动, 除非本地开发显式设 GA_RUNNER_ALLOW_RUNC=1。
      GA_RUNNER_ALLOW_RUNC: ${GA_RUNNER_ALLOW_RUNC:-0}
      GA_RUNNER_IDLE_TTL: ${GA_RUNNER_IDLE_TTL:-30m}
      GA_RUNNER_MEMORY_BYTES: ${GA_RUNNER_MEMORY_BYTES:-1073741824}
      GA_RUNNER_CPU_QUOTA: ${GA_RUNNER_CPU_QUOTA:-100000}
      GA_RUNNER_PIDS_LIMIT: ${GA_RUNNER_PIDS_LIMIT:-128}
      GA_WORKSPACES_ROOT: ${GA_WORKSPACES_ROOT:-/var/lib/ga/workspaces}
      GA_WORKSPACES_VOLUME: ${GA_WORKSPACES_VOLUME:-${COMPOSE_PROJECT_NAME:-ga}_runner_workspaces}
      GA_MANAGER_SECRET: ${GA_MANAGER_SECRET}
      GA_MANAGER_ID: ${GA_MANAGER_ID:-sandbox-manager-1}
      GA_MEMORY_TEMPLATE: ${GA_MEMORY_TEMPLATE:-/ga/memory-template}
      # round12 审查(I4): nonce 防重放状态持久化目录(必需, 见 volumes)。
      GA_MANAGER_NONCE_STATE: /var/lib/ga/manager-state
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=0700
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner_workspaces:/var/lib/ga/workspaces
      - manager_state:/var/lib/ga/manager-state
    # 审查 F11: 持 Docker socket(=宿主 root)的 Manager 不接入 runner-control
    # 内部网络, 与不可信 Runner 保持网络隔离——Manager 经 docker.sock 控制
    # 容器, 不需要也无法拨号 Runner 的 mTLS 端点(拨号由 Platform 完成)。
    networks:
      - application
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 30s
    logging: *default-logging

  web:
    image: ${GA_WEB_IMAGE:-genericagent-web:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/web.Dockerfile
    restart: unless-stopped
    user: "101:101"
    # round10 审查(B1c)接线修复: socket 文件权限 0660 属组 10001, nginx 进程
    # 必须加入该组才能经 /var/run/ga/api.sock 代理(缺失时 nginx 13: Permission denied)。
    group_add:
      - "10001"
    # round10 审查(B1c): web 独立网络命名空间; nginx 经共享卷上的 unix
    # socket 代理 Platform 主 API(/v1/, /healthz)——API 面不绑定 TCP 端口,
    # runner-control 网络中的 Runner 无法访问完整用户/管理 API。Platform 容器
    # 内只剩 loopback 8080(healthcheck)与 capability 保护的 8082。
    networks:
      - application
    ports:
      - "${GA_HTTP_BIND:-127.0.0.1}:${GA_HTTP_PORT:-8088}:8088"
    depends_on:
      platform:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=101,gid=101,mode=0700
    volumes:
      # round10 审查(B1c): nginx 经共享卷上的 unix socket 代理 Platform 主 API。
      - platform_sock:/var/run/ga:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8088/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 15s
    logging: *default-logging

  # ga-runner 镜像构建入口(方案 §8): scale: 0 使 `docker compose up -d --build`
  # 构建镜像但不启动容器(审查: 单命令部署必须包含 Runner 镜像构建)。
  # 容器实例由 Sandbox Manager 按工作区活跃状态动态创建。
  ga-runner:
    image: ${GA_RUNNER_IMAGE:-ga-runner:local}
    build:
      context: ../../..
      dockerfile: tenant_platform/infra/compose/ga-runner.Dockerfile
    scale: 0
    restart: "no"
    entrypoint: ["true"]
    logging: *default-logging

volumes:
  platform_sock:
  postgres_data:
  platform_runtime:
  platform_config:
  session_files:
  bot_media:
  # round9 审查: 交付 spool 卷(Platform rw / Poller ro), 文件快照跨容器可见。
  delivery_spool:
  # round12 审查(I4): Manager 控制面 nonce 防重放状态卷(跨重启持久化)。
  manager_state:
  # 显式卷名: sandbox-manager 用 volume-subpath 挂载子目录到 Runner(daemon 可解析)。
  # round11 审查(M2): 共享卷/内部网络加项目名前缀, 避免多套 Compose 部署
  # 在同一宿主机互相挂载对方的工作区卷与 runner-control 网络(隔离失败)。
  runner_workspaces:
    name: ${COMPOSE_PROJECT_NAME:-ga}_runner_workspaces

networks:
  application:
  database:
    internal: true
  runner-control:
    internal: true
    name: ${COMPOSE_PROJECT_NAME:-ga}_runner-control
  # llm-proxy 专有的出站网络(审查 C2): 非 internal, 供代理访问上游
  # LLM Provider; Runner 不接入, 保持 internal-only。
  llm-egress:
    name: llm-egress
