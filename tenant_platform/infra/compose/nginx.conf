worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 2m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8088;
        root /usr/share/nginx/html;
        index index.html;

        location /v1/ {
            # round9 审查: web 独立网络命名空间后, nginx 经 Docker DNS 代理到
            # Platform 容器(不再是同 namespace 的 127.0.0.1)——Runner 在
            # runner-control 网络无法访问 web/nginx, 完整 API 面不再暴露。
            proxy_pass http://unix:/var/run/ga/api.sock;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            proxy_send_timeout 35s;
        }

        location = /healthz {
            proxy_pass http://unix:/var/run/ga/api.sock:/healthz;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
