[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genericagent-worker"
version = "0.1.0"
description = "GenericAgent tenant platform Python worker"
requires-python = ">=3.10,<3.14"
dependencies = [
  "grpcio",
  "protobuf",
  "requests>=2.28",
  # 2026-08-15 审查: python-docx 是 export_docx 运行时硬依赖(非仅测试)——
  # 此前只挂 [test] extra, 非镜像部署会静默降级到显式报错路径。Dockerfile
  # 显式安装与这里重复, 属防御性一致声明。
  "python-docx",
]

[project.optional-dependencies]
test = [
  "pytest",
  "grpcio-tools",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
