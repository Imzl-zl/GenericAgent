[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genericagent-worker"
version = "0.1.0"
description = "GenericAgent tenant platform Python worker"
requires-python = ">=3.10,<3.14"
dependencies = [
  "grpcio",
  "protobuf",
  "requests>=2.28",
]

[project.optional-dependencies]
test = [
  "pytest",
  "grpcio-tools",
  "psutil",
  # round13 审查(CI): test_session_files 断言 export_docx 生成真实 docx;
  # 运行时缺失 python-docx 时工具走显式降级路径, 但测试必须验证完整行为。
  "python-docx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
