[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genericagent-worker"
version = "0.1.0"
description = "GenericAgent tenant platform Python worker"
requires-python = ">=3.10,<3.14"
dependencies = [
  "grpcio",
  "protobuf",
]

[project.optional-dependencies]
test = [
  "pytest",
  "grpcio-tools",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
