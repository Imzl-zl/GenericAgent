syntax = "proto3";

package genericagent.worker.v1;
option go_package = "github.com/Imzl-zl/GenericAgent/tenant_platform/backend-go/internal/gen/worker/v1;workerv1";

import "google/protobuf/timestamp.proto";

enum TerminalStatus {
  TERMINAL_STATUS_UNSPECIFIED = 0;
  TASK_SUCCEEDED = 1;
  TASK_FAILED = 2;
  TASK_CANCELLED = 3;
  TASK_INTERRUPTED = 4;
}

message RuntimePolicy {
  uint32 max_turns = 1;
  uint64 max_history_bytes = 2;
  uint64 max_working_bytes = 3;
  uint64 max_output_bytes = 4;
  uint32 task_timeout_seconds = 5;
  string capability_version = 6;
  string policy_digest = 7;
}

message StartSessionRequest {
  string session_key = 1;
  string snapshot_ref = 2;
  RuntimePolicy runtime_policy = 3;
  string snapshot_id = 4;
  string snapshot_checksum = 5;
  // workspace_key (personal:<uid> / team:<tid>) 与 runner_generation 由
  // Platform 在 mTLS 握手后校验; Runner 侧拒绝不匹配的控制请求(方案 §7)。
  string workspace_key = 6;
  uint64 runner_generation = 7;
  // max_bundle_bytes 是当前恢复快照的硬性大小上限(写入时由 Platform 按
  // Prepare 的 max_bundle_bytes 校验)。Runner 恢复时必须先按此限长读取,
  // 防止 committed/ 被替换为超大文件后无界读入内存(审查 R4-I6)。
  uint64 max_bundle_bytes = 8;
}

message StartSessionResponse {
  string session_key = 1;
  string worker_instance_id = 2;
}

message ReloadCredentialsRequest {
  uint64 credential_generation = 1;
  string config_checksum = 2;
  // 控制面身份 fencing(方案 §7, 审查): 迟到的 reload 请求必须绑定当前
  // workspace 与 Runner generation, Worker 侧拒绝不匹配的控制请求。
  string workspace_key = 3;
  uint64 runner_generation = 4;
}

message ReloadCredentialsResponse {
  uint64 credential_generation = 1;
  string config_checksum = 2;
}

message TaskEnvelope {
  string task_id = 1;
  string session_key = 2;
  int64 requester_user_id = 3;
  string source = 4;
  string source_instance_id = 5;
  string message_id = 6;
  string prompt = 7;
  repeated string persona_snapshot = 8;
  string tool_policy_version = 9;
  google.protobuf.Timestamp created_at = 10;
  // 每 task capability 的 generation 墙(方案 §7): 终态后不可用于下一 task。
  uint64 runner_generation = 12;
  string capability_jti = 13;
}

message ExecuteTaskRequest { TaskEnvelope task = 1; }

message Chunk {
  string task_id = 1;
  string text = 2;
  uint32 turn = 3;
}

message ToolProgress {
  string task_id = 1;
  string text = 2;
  uint32 turn = 3;
}

message BeginCheckpointRequest {
  string task_id = 1;
  string checkpoint_token = 2;
  string staging_ref = 3;
  uint64 max_bundle_bytes = 4;
  // runner_generation 绑定签发 checkpoint 时的 Runner lease generation
  // (方案 §7 fencing): Worker 回显, Platform 提交时校验, 防止旧 generation
  // Runner 在 lease 被接管后提交恢复点(审查 I7)。
  uint64 runner_generation = 5;
}

message CheckpointReady {
  string task_id = 1;
  string checkpoint_token = 2;
  string staging_ref = 3;
  string checksum = 4;
  string result_digest = 5;
  uint64 runner_generation = 6;
}

message ErrorEnvelope {
  string code = 1;
  string user_message = 2;
  string trace_id = 3;
}

message Terminal {
  string task_id = 1;
  TerminalStatus status = 2;
  string result_digest = 3;
  string user_message = 4;
  ErrorEnvelope error = 5;
}

message WorkerEvent {
  oneof payload {
    Chunk chunk = 1;
    ToolProgress tool_progress = 2;
    Terminal terminal = 3;
  }
}

message CancelTaskRequest {
  string task_id = 1;
  // 控制面身份 fencing(方案 §7, 审查): 与 ReloadCredentialsRequest 相同。
  string workspace_key = 2;
  uint64 runner_generation = 3;
}
message CancelTaskResponse { bool accepted = 1; }
message HealthRequest {}
message HealthResponse {
  string worker_instance_id = 1;
  string session_key = 2;
  bool ready = 3;
}
message ShutdownRequest {
  string reason = 1;
  // 控制面身份 fencing(方案 §7, 审查): 与 ReloadCredentialsRequest 相同。
  string workspace_key = 2;
  uint64 runner_generation = 3;
}
message ShutdownResponse { bool accepted = 1; }

service WorkerService {
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);
  rpc ReloadCredentials(ReloadCredentialsRequest) returns (ReloadCredentialsResponse);
  rpc ExecuteTask(ExecuteTaskRequest) returns (stream WorkerEvent);
  rpc BeginCheckpoint(BeginCheckpointRequest) returns (CheckpointReady);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}
