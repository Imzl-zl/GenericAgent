syntax = "proto3";

package genericagent.proxy.v1;
option go_package = "github.com/Imzl-zl/GenericAgent/tenant_platform/backend-go/internal/gen/proxy/v1;proxyv1";

message ChatMessage {
  string role = 1;
  string content = 2;
}

message GenerateRequest {
  string session_key = 1;
  string capability_token = 2;
  string model = 3;
  repeated ChatMessage messages = 4;
}

message TextChunk {
  string text = 1;
}

message Usage {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
}

message ErrorEnvelope {
  string code = 1;
  string user_message = 2;
  string trace_id = 3;
}

message GenerateEvent {
  oneof payload {
    TextChunk text = 1;
    Usage usage = 2;
    ErrorEnvelope error = 3;
  }
}

service LlmProxyService {
  rpc Generate(GenerateRequest) returns (stream GenerateEvent);
}
