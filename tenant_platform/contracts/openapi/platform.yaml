openapi: 3.1.0
info:
  title: GenericAgent Tenant Platform Foundation API
  version: 0.1.0
  description: >
    Loopback foundation HTTP contract for session tasks. X-Platform-Dev-Token is
    required for this foundation-only API. No browser chat endpoint is exposed;
    the P0 user chat path remains BotTransportAdapter.
servers:
  - url: http://127.0.0.1:8080
    description: Local loopback foundation backend
security:
  - PlatformDevToken: []
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [ok]
                    example: ok
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/sessions/{session_key}/tasks:
    post:
      operationId: createTask
      summary: Accept a task for the given session
      parameters:
        - $ref: "#/components/parameters/SessionKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskEnvelope"
      responses:
        "202":
          description: Task accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - task_id
                  - status
                properties:
                  task_id:
                    type: string
                  status:
                    type: string
                    enum: [queued]
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/tasks/{task_id}:
    get:
      operationId: getTask
      summary: Read task status and opaque result references
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task status envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/tasks/{task_id}/result:
    get:
      operationId: getTaskResult
      summary: Read the bounded committed result by opaque result_ref
      description: >
        Returns the committed result payload identified by an opaque result_ref
        and its matching digest. Host filesystem paths are never accepted.
        result_ref is optional; when omitted the platform resolves the result
        for the given task_id.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - name: result_ref
          in: query
          required: false
          schema:
            type: string
          description: Opaque committed result reference (never a host path)
      responses:
        "200":
          description: Committed result payload and digest
          content:
            application/json:
              schema:
                type: object
                required:
                  - result_ref
                  - result_digest
                  - content_type
                  - payload
                properties:
                  result_ref:
                    type: string
                  result_digest:
                    type: string
                  content_type:
                    type: string
                    description: MIME type of the committed result body
                    example: text/plain; charset=utf-8
                  payload:
                    type: string
                    description: >
                      UTF-8 text of the committed result body. The digest in
                      result_digest is sha256 over these exact UTF-8 bytes.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/tasks/{task_id}/cancel:
    post:
      operationId: cancelTask
      summary: Request cooperative task cancellation
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Cancellation acceptance and current status
          content:
            application/json:
              schema:
                type: object
                required:
                  - accepted
                  - status
                properties:
                  accepted:
                    type: boolean
                  status:
                    type: string
                    enum: [queued, starting, running, succeeded, failed, cancelled, interrupted]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/users:
    post:
      operationId: adminCreateUser
      summary: Create a pending platform user (admin-only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created in pending state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRecord"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/users/{user_id}/approve:
    post:
      operationId: adminApproveUser
      summary: Approve a pending user (pending → approved)
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRecord"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/users/{user_id}/block:
    post:
      operationId: adminBlockUser
      summary: Block a user (approved → blocked); cancels queued/running tasks
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRecord"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/users/pending:
    get:
      operationId: adminListPendingUsers
      summary: List users in pending state
      responses:
        "200":
          description: Pending users
          content:
            application/json:
              schema:
                type: object
                required:
                  - users
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/bots:
    post:
      operationId: adminCreateBot
      summary: Register a WeChat/iLink bot for a platform user
      description: >
        Stores the upstream bot token encrypted at rest. The plaintext token
        is returned to the caller only once (from iLink); the platform never
        persists or logs it in plaintext.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBotRequest"
      responses:
        "201":
          description: Bot registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotRecord"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/llm-providers:
    get:
      operationId: adminListLLMProviders
      summary: List all LLM providers (admin-only)
      tags: [admin]
      security: [{PlatformDevToken: []}]
      responses:
        "200":
          description: Provider list
          content:
            application/json:
              schema:
                type: object
                required:
                  - providers
                properties:
                  providers:
                    type: array
                    items: {$ref: "#/components/schemas/LLMProvider"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: adminCreateLLMProvider
      summary: Create an upstream LLM provider (admin-only)
      tags: [admin]
      security: [{PlatformDevToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLLMProviderRequest"
      responses:
        "201":
          description: Provider created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMProvider"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/llm-providers/{provider_id}:
    get:
      operationId: adminGetLLMProvider
      summary: Get an LLM provider by ID (admin-only)
      tags: [admin]
      security: [{PlatformDevToken: []}]
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: Provider record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: adminUpdateLLMProvider
      summary: Update an LLM provider (admin-only)
      tags: [admin]
      security: [{PlatformDevToken: []}]
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLLMProviderRequest"
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMProvider"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: adminDeleteLLMProvider
      summary: Delete an LLM provider (admin-only)
      tags: [admin]
      security: [{PlatformDevToken: []}]
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        "204":
          description: Provider deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/llm-providers/{provider_id}/default:
    post:
      operationId: adminSetDefaultLLMProvider
      summary: Set the default LLM provider (admin-only)
      tags: [admin]
      security: [{PlatformDevToken: []}]
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: Default provider set
          content:
            application/json:
              schema:
                type: object
                required:
                  - provider_id
                  - is_default
                properties:
                  provider_id:
                    type: integer
                    format: int64
                  is_default:
                    type: boolean
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/llm-providers/{provider_id}/disable:
    post:
      operationId: adminDisableLLMProvider
      summary: Disable a non-default LLM provider (admin-only)
      tags: [admin]
      security: [{PlatformDevToken: []}]
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: Disabled provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/llm-providers/{provider_id}/enable:
    post:
      operationId: adminEnableLLMProvider
      summary: Enable an LLM provider (admin-only)
      tags: [admin]
      security: [{PlatformDevToken: []}]
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        "200":
          description: Enabled provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLMProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/mcp-servers:
    get:
      operationId: adminListMCPServers
      summary: List globally shared MCP servers (admin-only)
      tags: [admin]
      security: [{PlatformDevToken: []}]
      responses:
        "200":
          description: MCP server list
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items: {$ref: "#/components/schemas/MCPServer"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
    post:
      operationId: adminCreateMCPServer
      summary: Create a disabled global MCP server (admin-only)
      tags: [admin]
      security: [{PlatformDevToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMCPServerRequest"}
      responses:
        "201":
          description: Disabled MCP server created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPServer"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/admin/mcp-servers/{mcp_server_id}:
    parameters:
      - name: mcp_server_id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    put:
      operationId: adminUpdateMCPServer
      summary: Update a global MCP server (admin-only)
      tags: [admin]
      security: [{PlatformDevToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateMCPServerRequest"}
      responses:
        "200":
          description: MCP server updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPServer"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "500": {$ref: "#/components/responses/InternalError"}
    delete:
      operationId: adminDeleteMCPServer
      summary: Delete a global MCP server (admin-only)
      tags: [admin]
      security: [{PlatformDevToken: []}]
      responses:
        "204": {description: MCP server deleted}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/admin/mcp-servers/{mcp_server_id}/enable:
    post:
      operationId: adminEnableMCPServer
      summary: Enable an MCP server for every tenant (admin-only)
      tags: [admin]
      security: [{PlatformDevToken: []}]
      parameters:
        - name: mcp_server_id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: MCP server enabled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPServer"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/admin/mcp-servers/{mcp_server_id}/disable:
    post:
      operationId: adminDisableMCPServer
      summary: Disable an MCP server for every tenant (admin-only)
      tags: [admin]
      security: [{PlatformDevToken: []}]
      parameters:
        - name: mcp_server_id
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: MCP server disabled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MCPServer"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /v1/bindings:
    post:
      operationId: createBinding
      summary: Generate a one-time WeChat binding code for a user
      description: >
        Returns the plaintext code ONCE; only its SHA-256 hash is persisted.
        The code expires after a short TTL (default 10 minutes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBindingRequest"
      responses:
        "201":
          description: Binding code generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingCode"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/activate:
    post:
      operationId: activateBinding
      summary: Activate a binding code and pair a bot with an ilink user
      description: >
        HTTP equivalent of the /activate bot command (spec §6.2). Consumes
        the one-time code atomically and binds the bot to the ilink_user_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateRequest"
      responses:
        "200":
          description: Binding activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingRecord"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/router/messages:
    post:
      operationId: routerMessage
      summary: Ingest one bot message through the router pipeline
      description: >
        Processes identity resolution, user status check, command parsing
        (/stop, /new, /activate), and task routing. Replies are sent via
        the BotTransportAdapter; the HTTP response carries the action
        classification for observability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouterMessage"
      responses:
        "200":
          description: Message processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/commands:
    get:
      tags: [admin]
      summary: List all platform commands (admin-configurable)
      security: [{PlatformDevToken: []}]
      responses:
        "200":
          description: Command list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PlatformCommand"}
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/commands/{command_id}:
    put:
      tags: [admin]
      summary: Update a platform command (enable/disable, reclassify, edit help)
      security: [{PlatformDevToken: []}]
      parameters:
        - name: command_id
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateCommandRequest"}
      responses:
        "200":
          description: Updated command
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlatformCommand"}
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/tool-policies:
    get:
      tags: [admin]
      summary: List all tool policies
      security: [{PlatformDevToken: []}]
      responses:
        "200":
          description: Policy list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ToolPolicy"}
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [admin]
      summary: Create a new tool policy version
      security: [{PlatformDevToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateToolPolicyRequest"}
      responses:
        "201":
          description: Created policy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ToolPolicy"}
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/sophub/binding:
    get:
      operationId: adminGetSophubBinding
      summary: Read write-only Sophub binding status
      tags: [admin, sop]
      responses:
        "200":
          description: Binding status without the API key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SophubBindingStatus"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
    put:
      operationId: adminBindSophub
      summary: Verify and replace the encrypted Sophub API key
      tags: [admin, sop]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: {type: string, writeOnly: true, minLength: 1}
      responses:
        "200":
          description: Verified binding status; the key is never returned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SophubBindingStatus"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /v1/admin/sophub/search:
    get:
      operationId: adminSearchSophubSOPs
      summary: Search approved SOP metadata at the fixed Sophub origin
      tags: [admin, sop]
      parameters:
        - {name: q, in: query, required: false, schema: {type: string}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 24}}
      responses:
        "200":
          description: Sophub search result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SophubSearchResult"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  # Worker Sophub proxy(方案 §5.2): Runner 经 Platform 受控代理搜索/安装,
  # 携带 ga-sophub-proxy audience 的 per-task capability(不暴露 Sophub Key)。
  /v1/worker/sophub/search:
    get:
      operationId: workerSophubSearch
      summary: Search installable SOPs on behalf of a Runner
      tags: [worker, sop]
      security:
        - BearerToken: []
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1}}
      responses:
        "200":
          description: Installable SOP search result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SophubSearchResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /v1/worker/sophub/install:
    get:
      operationId: workerSophubInstall
      summary: Fetch one installable SOP on behalf of a Runner
      tags: [worker, sop]
      security:
        - BearerToken: []
      parameters:
        - {name: id, in: query, required: true, schema: {type: string, minLength: 1}}
      responses:
        "200":
          description: Fetch result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SophubInstallResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
components:
  securitySchemes:
    PlatformDevToken:
      type: apiKey
      in: header
      name: X-Platform-Dev-Token
      description: Required foundation-only loopback development token
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: platform-user-token
  parameters:
    SessionKey:
      name: session_key
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    CandidateId:
      name: candidate_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    ValidationError:
      description: Client-side validation failure (e.g. prompt too long, unknown source)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid X-Platform-Dev-Token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Task or result not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current task state (e.g. result_ref mismatch)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SophubBindingStatus:
      type: object
      required: [configured]
      description: 未绑定时服务端仅返回 {configured:false}(见 sop_http.go), 其余字段可选
      properties:
        configured: {type: boolean}
        author_type: {type: string}
        agent_uid: {type: string}
        display_name: {type: string}
        verified_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SophubSearchItem:
      type: object
      required: [id, title, preview, file_type, package_type, status]
      properties:
        id: {type: string}
        title: {type: string}
        preview: {type: string}
        file_type: {type: string}
        package_type: {type: string}
        status: {type: string}
        content: {type: string}
    SophubInstallResult:
      type: object
      additionalProperties: false
      required: [id, title, content]
      description: Worker install 接口实际返回(仅公开 approved single-file markdown 的 id/title/content, 见 sop_http.go)
      properties:
        id: {type: string}
        title: {type: string}
        content: {type: string}
    SophubSearchResult:
      type: object
      required: [items, total, page, page_size, total_pages, has_more]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/SophubSearchItem"}}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1}
        total_pages: {type: integer, minimum: 0}
        has_more: {type: boolean}
    ErrorResponse:
      type: object
      required:
        - code
        - message
        - trace_id
      properties:
        code:
          type: string
          description: Stable machine-readable error code
          example: SUBMIT_FAILED
        message:
          type: string
          description: Human-readable error message
        trace_id:
          type: string
          description: Correlation trace id for debugging
    TaskEnvelope:
      type: object
      required:
        - message_id
        - source_instance_id
        - prompt
        - source
        - persona_snapshot
        - tool_policy_version
      properties:
        message_id:
          type: string
        source_instance_id:
          type: string
        prompt:
          type: string
        source:
          type: string
          enum: [wechat, web]
        persona_snapshot:
          type: array
          items:
            type: string
        tool_policy_version:
          type: string
        task_id:
          type: string
          description: Ignored on submit; platform assigns task_id
        session_key:
          type: string
          description: Ignored on submit; derived from path
        requester_user_id:
          type: integer
          format: int64
          description: Ignored on submit; derived from bootstrapped dev context
    TaskStatus:
      type: object
      required:
        - task_id
        - session_key
        - status
      properties:
        task_id:
          type: string
        session_key:
          type: string
        status:
          type: string
          enum: [queued, starting, running, succeeded, failed, cancelled, interrupted]
        snapshot_id:
          type: string
        snapshot_checksum:
          type: string
        result_ref:
          type: string
          description: Opaque committed result reference; never a host path
        result_digest:
          type: string
        terminal_error:
          type:
            - object
            - "null"
          properties:
            code:
              type: string
            user_message:
              type: string
            trace_id:
              type: string
    CreateUserRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          description: Platform username (1-64 bytes)
    UserRecord:
      type: object
      required:
        - user_id
        - username
        - status
        - created_at
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        status:
          type: string
          enum: [pending, approved, blocked]
        created_at:
          type: string
          format: date-time
        approved_at:
          type: string
          format: date-time
          nullable: true
    CreateBotRequest:
      type: object
      required:
        - owner_id
        - bot_uuid
        - token
      properties:
        owner_id:
          type: integer
          format: int64
          minimum: 1
        bot_uuid:
          type: string
          format: uuid
        token:
          type: string
          description: Upstream iLink bot token; encrypted at rest by the platform
    BotRecord:
      type: object
      required:
        - bot_id
        - bot_uuid
        - owner_id
        - state
        - created_at
      properties:
        bot_id:
          type: integer
          format: int64
        bot_uuid:
          type: string
          format: uuid
        owner_id:
          type: integer
          format: int64
        state:
          type: string
          enum: [active, expired, revoked]
        created_at:
          type: string
          format: date-time
    CreateBindingRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 1
    BindingCode:
      type: object
      required:
        - code
        - binding_id
        - user_id
        - state
        - expires_at
      properties:
        code:
          type: string
          description: One-time plaintext binding code; returned ONCE, never persisted
        binding_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        state:
          type: string
          enum: [requested, qr_pending, awaiting_activation, active, expired, revoked]
        expires_at:
          type: string
          format: date-time
    ActivateRequest:
      type: object
      required:
        - code
        - bot_uuid
        - ilink_user_id
      properties:
        code:
          type: string
          description: One-time binding code (plaintext)
        bot_uuid:
          type: string
          format: uuid
        ilink_user_id:
          type: string
          description: External IM user id to bind to the bot
    BindingRecord:
      type: object
      required:
        - binding_id
        - user_id
        - state
      properties:
        binding_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        state:
          type: string
          enum: [requested, qr_pending, awaiting_activation, active, expired, revoked]
        activated_at:
          type: string
          format: date-time
          nullable: true
    RouterMessage:
      type: object
      required:
        - bot_uuid
        - ilink_user_id
        - message_id
        - text
      properties:
        bot_uuid:
          type: string
          format: uuid
        ilink_user_id:
          type: string
        message_id:
          type: string
          description: Transport-unique message id for idempotency
        text:
          type: string
          description: Message text; may be a command (/stop, /new, /activate) or normal text
    RouterResult:
      type: object
      required:
        - action
        - reply
      properties:
        action:
          type: string
          enum: [activated, stopped, new_session, task_created, rejected, duplicate, no_running_task, help, status, model_info]
        reply:
          type: string
          description: Reply text sent to the user via the transport
        user_id:
          type: integer
          format: int64
          nullable: true
    PlatformCommand:
      type: object
      required:
        - id
        - command
        - action
        - handler
        - enabled
      properties:
        id:
          type: integer
          format: int64
        command:
          type: string
          example: "/stop"
        action:
          type: string
          enum: [intercept, passthrough]
        handler:
          type: string
          example: "stop"
        help_text:
          type: string
        enabled:
          type: boolean
        sort_order:
          type: integer
        updated_at:
          type: string
          format: date-time
    UpdateCommandRequest:
      type: object
      required:
        - action
        - enabled
      properties:
        action:
          type: string
          enum: [intercept, passthrough]
        help_text:
          type: string
        enabled:
          type: boolean
        sort_order:
          type: integer
    ToolPolicy:
      type: object
      required:
        - id
        - version
        - allowed_tools
        - enabled
      properties:
        id:
          type: integer
          format: int64
        version:
          type: string
          example: "foundation.no-host-tools.v1"
        allowed_tools:
          type: array
          items:
            type: string
          example: ["update_working_checkpoint"]
        description:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateToolPolicyRequest:
      type: object
      required:
        - version
        - allowed_tools
      properties:
        version:
          type: string
          example: "foundation.code-run.v1"
        allowed_tools:
          type: array
          items:
            type: string
          example: ["update_working_checkpoint", "code_run", "file_read"]
        description:
          type: string
    LLMProviderType:
      type: string
      enum: [native_oai, native_claude]
    ProviderAuthMode:
      type: string
      enum: [auto, bearer, x_api_key]
    GASessionConfig:
      type: object
      additionalProperties: false
      properties:
        thinking_type:
          type: [string, "null"]
          enum: [adaptive, enabled, disabled, null]
        thinking_budget_tokens:
          type: [integer, "null"]
          minimum: 1
        reasoning_effort:
          type: [string, "null"]
          enum: [none, minimal, low, medium, high, xhigh, max, null]
        temperature:
          type: [number, "null"]
          minimum: 0
          maximum: 2
        max_tokens:
          type: [integer, "null"]
          minimum: 1
        context_win:
          type: [integer, "null"]
          minimum: 1
        trim_keep_prefix:
          type: [integer, "null"]
          minimum: 0
        max_retries:
          type: [integer, "null"]
          minimum: 0
        read_timeout:
          type: [integer, "null"]
          minimum: 5
          description: GA Core upstream read timeout in seconds
        stream:
          type: [boolean, "null"]
        api_mode:
          type: [string, "null"]
          enum: [chat_completions, responses, null]
          description: Supported only by native_oai
        fake_cc_system_prompt:
          type: [boolean, "null"]
          description: Supported only by native_claude
        user_agent:
          type: [string, "null"]
          minLength: 1
        service_tier:
          type: [string, "null"]
          enum: [auto, default, priority, flex, null]
          description: Supported only by native_oai
        omit_thinking:
          type: [boolean, "null"]
        extra_sys_prompt:
          type: [string, "null"]
    ProviderTransportConfig:
      type: object
      additionalProperties: false
      required: [auth_mode]
      properties:
        auth_mode:
          $ref: "#/components/schemas/ProviderAuthMode"
        proxy_url:
          type: [string, "null"]
          format: uri
        tls_verify:
          type: [boolean, "null"]
        connect_timeout_seconds:
          type: [integer, "null"]
          minimum: 1
        response_header_timeout_seconds:
          type: [integer, "null"]
          minimum: 1
    LLMProvider:
      type: object
      additionalProperties: false
      required:
        - provider_id
        - name
        - provider_type
        - base_url
        - model
        - session_config
        - transport_config
        - revision
        - is_default
        - state
        - created_at
        - updated_at
      properties:
        provider_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
        provider_type:
          $ref: "#/components/schemas/LLMProviderType"
        base_url:
          type: string
          format: uri
        model:
          type: string
          minLength: 1
        session_config:
          $ref: "#/components/schemas/GASessionConfig"
        transport_config:
          $ref: "#/components/schemas/ProviderTransportConfig"
        revision:
          type: integer
          format: int64
          minimum: 1
        is_default:
          type: boolean
        state:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MCPServer:
      type: object
      additionalProperties: false
      required: [mcp_server_id, server_key, name, url, timeout_seconds, enabled, revision, created_at, updated_at]
      properties:
        mcp_server_id: {type: integer, format: int64, minimum: 1}
        server_key: {type: string, pattern: "^[A-Za-z0-9_]{1,32}$"}
        name: {type: string, minLength: 1}
        url: {type: string, format: uri}
        timeout_seconds: {type: integer, minimum: 1, maximum: 300}
        enabled: {type: boolean}
        revision: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CreateMCPServerRequest:
      type: object
      additionalProperties: false
      required: [server_key, name, url, timeout_seconds]
      properties:
        server_key: {type: string, pattern: "^[A-Za-z0-9_]{1,32}$"}
        name: {type: string, minLength: 1}
        url: {type: string, format: uri}
        timeout_seconds: {type: integer, minimum: 1, maximum: 300}
    UpdateMCPServerRequest:
      type: object
      additionalProperties: false
      required: [server_key, name, url, timeout_seconds]
      properties:
        server_key: {type: string, pattern: "^[A-Za-z0-9_]{1,32}$"}
        name: {type: string, minLength: 1}
        url: {type: string, format: uri}
        timeout_seconds: {type: integer, minimum: 1, maximum: 300}
    CreateLLMProviderRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - provider_type
        - base_url
        - model
        - api_key
        - session_config
        - transport_config
      properties:
        name:
          type: string
          minLength: 1
        provider_type:
          $ref: "#/components/schemas/LLMProviderType"
        base_url:
          type: string
          format: uri
        model:
          type: string
          minLength: 1
        api_key:
          type: string
          minLength: 1
          writeOnly: true
          description: Upstream API key; encrypted at rest and never returned
        session_config:
          $ref: "#/components/schemas/GASessionConfig"
        transport_config:
          $ref: "#/components/schemas/ProviderTransportConfig"
    UpdateLLMProviderRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - provider_type
        - base_url
        - model
        - session_config
        - transport_config
      properties:
        name:
          type: string
          minLength: 1
        provider_type:
          $ref: "#/components/schemas/LLMProviderType"
        base_url:
          type: string
          format: uri
        model:
          type: string
          minLength: 1
        api_key:
          type: string
          writeOnly: true
          description: Optional; omitted or blank preserves the stored key
        session_config:
          $ref: "#/components/schemas/GASessionConfig"
        transport_config:
          $ref: "#/components/schemas/ProviderTransportConfig"
