        - name: channel_type
          in: path
          required: true
          schema: {type: string, enum: [feishu, dingtalk, qq, wecom]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SaveChannelBindingRequest"}
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChannelBinding"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
