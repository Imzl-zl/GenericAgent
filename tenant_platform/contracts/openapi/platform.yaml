openapi: 3.1.0
info:
  title: GenericAgent Tenant Platform Foundation API
  version: 0.1.0
  description: >
    Loopback foundation HTTP contract for session tasks. X-Platform-Dev-Token is
    required for this foundation-only API. No browser chat endpoint is exposed;
    the P0 user chat path remains BotTransportAdapter.
servers:
  - url: http://127.0.0.1:8080
    description: Local loopback foundation backend
security:
  - PlatformDevToken: []
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [ok]
                    example: ok
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/sessions/{session_key}/tasks:
    post:
      operationId: createTask
      summary: Accept a task for the given session
      parameters:
        - $ref: "#/components/parameters/SessionKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskEnvelope"
      responses:
        "202":
          description: Task accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - task_id
                  - status
                properties:
                  task_id:
                    type: string
                  status:
                    type: string
                    enum: [queued]
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/tasks/{task_id}:
    get:
      operationId: getTask
      summary: Read task status and opaque result references
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task status envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/tasks/{task_id}/result:
    get:
      operationId: getTaskResult
      summary: Read the bounded committed result by opaque result_ref
      description: >
        Returns the committed result payload identified by an opaque result_ref
        and its matching digest. Host filesystem paths are never accepted.
        result_ref is optional; when omitted the platform resolves the result
        for the given task_id.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - name: result_ref
          in: query
          required: false
          schema:
            type: string
          description: Opaque committed result reference (never a host path)
      responses:
        "200":
          description: Committed result payload and digest
          content:
            application/json:
              schema:
                type: object
                required:
                  - result_ref
                  - result_digest
                  - content_type
                  - payload
                properties:
                  result_ref:
                    type: string
                  result_digest:
                    type: string
                  content_type:
                    type: string
                    description: MIME type of the committed result body
                    example: text/plain; charset=utf-8
                  payload:
                    type: string
                    description: >
                      UTF-8 text of the committed result body. The digest in
                      result_digest is sha256 over these exact UTF-8 bytes.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/tasks/{task_id}/cancel:
    post:
      operationId: cancelTask
      summary: Request cooperative task cancellation
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Cancellation acceptance and current status
          content:
            application/json:
              schema:
                type: object
                required:
                  - accepted
                  - status
                properties:
                  accepted:
                    type: boolean
                  status:
                    type: string
                    enum: [queued, starting, running, succeeded, failed, cancelled, interrupted]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    PlatformDevToken:
      type: apiKey
      in: header
      name: X-Platform-Dev-Token
      description: Required foundation-only loopback development token
  parameters:
    SessionKey:
      name: session_key
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
  responses:
    ValidationError:
      description: Client-side validation failure (e.g. prompt too long, unknown source)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid X-Platform-Dev-Token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Task or result not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current task state (e.g. result_ref mismatch)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - message
        - trace_id
      properties:
        code:
          type: string
          description: Stable machine-readable error code
          example: SUBMIT_FAILED
        message:
          type: string
          description: Human-readable error message
        trace_id:
          type: string
          description: Correlation trace id for debugging
    TaskEnvelope:
      type: object
      required:
        - message_id
        - source_instance_id
        - prompt
        - source
        - persona_snapshot
        - tool_policy_version
      properties:
        message_id:
          type: string
        source_instance_id:
          type: string
        prompt:
          type: string
        source:
          type: string
          enum: [wechat, web]
        persona_snapshot:
          type: array
          items:
            type: string
        tool_policy_version:
          type: string
        task_id:
          type: string
          description: Ignored on submit; platform assigns task_id
        session_key:
          type: string
          description: Ignored on submit; derived from path
        requester_user_id:
          type: integer
          format: int64
          description: Ignored on submit; derived from bootstrapped dev context
    TaskStatus:
      type: object
      required:
        - task_id
        - session_key
        - status
      properties:
        task_id:
          type: string
        session_key:
          type: string
        status:
          type: string
          enum: [queued, starting, running, succeeded, failed, cancelled, interrupted]
        snapshot_id:
          type: string
        snapshot_checksum:
          type: string
        result_ref:
          type: string
          description: Opaque committed result reference; never a host path
        result_digest:
          type: string
        terminal_error:
          type:
            - object
            - "null"
          properties:
            code:
              type: string
            user_message:
              type: string
            trace_id:
              type: string
