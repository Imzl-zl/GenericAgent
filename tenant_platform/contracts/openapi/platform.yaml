        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
components:
  securitySchemes:
    PlatformAdminToken:
      type: apiKey
      in: header
      name: X-Platform-Admin-Token
      description: Required foundation-only loopback development token
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: platform-user-token
  parameters:
    SessionKey:
      name: session_key
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    CandidateId:
      name: candidate_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    ValidationError:
      description: Client-side validation failure (e.g. prompt too long, unknown source)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid X-Platform-Admin-Token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Task or result not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current task state (e.g. result_ref mismatch)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SophubBindingStatus:
      type: object
      required: [configured]
      description: 未绑定时服务端仅返回 {configured:false}(见 sop_http.go), 其余字段可选
      properties:
        configured: {type: boolean}
        author_type: {type: string}
        agent_uid: {type: string}
        display_name: {type: string}
        verified_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SophubSearchItem:
      type: object
      required: [id, title, preview, file_type, package_type, status]
      properties:
        id: {type: string}
        title: {type: string}
        preview: {type: string}
        file_type: {type: string}
        package_type: {type: string}
        status: {type: string}
        content: {type: string}
    SophubInstallResult:
      type: object
      additionalProperties: false
      required: [id, title, content]
      description: Worker install 接口实际返回(仅公开 approved single-file markdown 的 id/title/content, 见 sop_http.go)
      properties:
        id: {type: string}
        title: {type: string}
        content: {type: string}
    SophubSearchResult:
      type: object
      required: [items, total, page, page_size, total_pages, has_more]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/SophubSearchItem"}}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1}
        total_pages: {type: integer, minimum: 0}
        has_more: {type: boolean}
    ErrorResponse:
      type: object
      required:
        - code
        - message
        - trace_id
      properties:
        code:
          type: string
          description: Stable machine-readable error code
          example: SUBMIT_FAILED
        message:
          type: string
          description: Human-readable error message
        trace_id:
          type: string
          description: Correlation trace id for debugging
    TaskEnvelope:
      type: object
      required:
        - message_id
        - source_instance_id
        - prompt
        - source
        - persona_snapshot
      properties:
        message_id:
          type: string
        source_instance_id:
          type: string
        prompt:
          type: string
        source:
          type: string
          enum: [wechat, web]
        persona_snapshot:
          type: array
          items:
            type: string
        task_id:
          type: string
          description: Ignored on submit; platform assigns task_id
        session_key:
          type: string
          description: Ignored on submit; derived from path
        requester_user_id:
          type: integer
          format: int64
          description: Ignored on submit; derived from bootstrapped dev context
    TaskStatus:
      type: object
      required:
        - task_id
        - session_key
        - status
      properties:
        task_id:
          type: string
        session_key:
          type: string
        status:
          type: string
          enum: [queued, starting, running, succeeded, failed, cancelled, interrupted]
        snapshot_id:
          type: string
        snapshot_checksum:
          type: string
        result_ref:
          type: string
          description: Opaque committed result reference; never a host path
        result_digest:
          type: string
        terminal_error:
          type:
            - object
            - "null"
          properties:
            code:
              type: string
            user_message:
              type: string
            trace_id:
              type: string
    UserTask:
      type: object
      required:
        - task_id
        - session_key
        - status
        - source
        - created_at
      properties:
        task_id:
          type: string
        session_key:
          type: string
        status:
          type: string
          enum: [queued, starting, running, succeeded, failed, cancelled, interrupted]
        source:
          type: string
          enum: [wechat, web]
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        terminal_at:
          type: string
          format: date-time
          nullable: true
        terminal_error_code:
          type: string
          description: 终态错误码（仅失败/取消时非空）
    UserTaskList:
      type: object
      required:
        - tasks
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/UserTask"
    UserTaskStats:
      type: object
      required:
        - queued
        - running
        - succeeded
        - failed
        - cancelled
        - interrupted
        - total
      properties:
        queued:
          type: integer
        running:
          type: integer
          description: starting + running 合计
        succeeded:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
        interrupted:
          type: integer
        total:
          type: integer
          description: 全部任务数
    CreateUserRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          description: Platform username (1-64 bytes)
        password:
          type: string
          description: Optional password; empty means an admin-created test account
    UserRecord:
      type: object
      required:
        - user_id
        - username
        - status
        - created_at
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        status:
          type: string
          enum: [pending, approved, blocked]
        created_at:
          type: string
          format: date-time
        approved_at:
          type: string
          format: date-time
          nullable: true
    RouterMessage:
      type: object
      required:
        - bot_uuid
        - channel_type
        - channel_account_id
        - message_id
      properties:
        bot_uuid:
          type: string
          format: uuid
        channel_type:
          type: string
          enum: [wechat, feishu, dingtalk, qq, wecom]
          description: 渠道类型(同时是任务 Source 与回复分发依据)
        channel_account_id:
          type: string
          description: 渠道侧账号标识(微信=ilink_user_id, 其他=发送者账号)
        conversation_id:
          type: string
          description: 对话单元 ID(群 ID / 对端 ID; 微信恒空)——分桶键
        message_id:
          type: string
          description: Transport-unique message id for idempotency
        text:
          type: string
          description: Message text; may be a command (/stop, /new, /activate) or normal text
    SaveChannelBindingRequest:
      type: object
      required:
        - app_id
        - app_secret
      additionalProperties: false
      properties:
        app_id:
          type: string
          minLength: 1
          maxLength: 128
          description: 飞书/QQ 应用 app_id; 钉钉为 app_key
        app_secret:
          type: string
          minLength: 1
          maxLength: 256
          description: 应用密钥(加密入库, 永不回显)
    ChannelBinding:
      type: object
      required:
        - channel_type
        - state
      properties:
        channel_type:
          type: string
          enum: [wechat, feishu, dingtalk, qq, wecom]
        state:
          type: string
          enum: [active, disabled, expired, revoked]
        bound_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        meta:
          type: object
          description: '脱敏元数据(wechat: ilink_bot_id/channel_account_id; 其他: app_id)'
    RouterResult:
      type: object
      required:
        - action
        - reply
      properties:
        action:
          type: string
          enum: [activated, stopped, new_session, task_created, rejected, duplicate, no_running_task, help, status, model_info]
        reply:
          type: string
          description: Reply text sent to the user via the transport
        user_id:
          type: integer
          format: int64
          nullable: true
    PlatformCommand:
      type: object
      required:
        - id
        - command
        - action
        - handler
        - enabled
      properties:
        id:
          type: integer
          format: int64
        command:
          type: string
          example: "/stop"
        action:
          type: string
          enum: [intercept, passthrough]
        handler:
          type: string
          example: "stop"
        help_text:
          type: string
        enabled:
          type: boolean
        sort_order:
          type: integer
        updated_at:
          type: string
          format: date-time
    UpdateCommandRequest:
      type: object
      required:
        - action
        - enabled
      properties:
        action:
          type: string
          enum: [intercept, passthrough]
        help_text:
          type: string
        enabled:
          type: boolean
        sort_order:
          type: integer
    LLMProviderType:
      type: string
      enum: [native_oai, native_claude]
    ProviderAuthMode:
      type: string
      enum: [auto, bearer, x_api_key]
    GASessionConfig:
      type: object
      additionalProperties: false
      properties:
        thinking_type:
          type: [string, "null"]
          enum: [adaptive, enabled, disabled, null]
        thinking_budget_tokens:
          type: [integer, "null"]
          minimum: 1
        reasoning_effort:
          type: [string, "null"]
          enum: [none, minimal, low, medium, high, xhigh, max, null]
        temperature:
          type: [number, "null"]
          minimum: 0
          maximum: 2
        max_tokens:
          type: [integer, "null"]
          minimum: 1
        context_win:
          type: [integer, "null"]
          minimum: 1
        trim_keep_prefix:
          type: [integer, "null"]
          minimum: 0
        max_retries:
          type: [integer, "null"]
          minimum: 0
        read_timeout:
          type: [integer, "null"]
          minimum: 5
          description: GA Core upstream read timeout in seconds
        stream:
          type: [boolean, "null"]
        api_mode:
          type: [string, "null"]
          enum: [chat_completions, responses, null]
          description: Supported only by native_oai
        fake_cc_system_prompt:
          type: [boolean, "null"]
          description: Supported only by native_claude
        user_agent:
          type: [string, "null"]
          minLength: 1
        service_tier:
          type: [string, "null"]
          enum: [auto, default, priority, flex, null]
          description: Supported only by native_oai
        omit_thinking:
          type: [boolean, "null"]
        extra_sys_prompt:
          type: [string, "null"]
    ProviderTransportConfig:
      type: object
      additionalProperties: false
      required: [auth_mode]
      properties:
        auth_mode:
          $ref: "#/components/schemas/ProviderAuthMode"
        proxy_url:
          type: [string, "null"]
          format: uri
        tls_verify:
          type: [boolean, "null"]
        connect_timeout_seconds:
          type: [integer, "null"]
          minimum: 1
        response_header_timeout_seconds:
          type: [integer, "null"]
          minimum: 1
    LLMProviderCapability:
      type: string
      enum: [chat, image]
      description: "能力维度: chat=对话(llm.chat 路由), image=生图(llm.image 路由, 仅 native_oai)"

    LLMProvider:
      type: object
      additionalProperties: false
      required:
        - provider_id
        - name
        - provider_type
        - base_url
        - model
        - session_config
        - transport_config
        - revision
        - is_default
        - state
        - created_at
        - updated_at
      properties:
        provider_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
        provider_type:
          $ref: "#/components/schemas/LLMProviderType"
        base_url:
          type: string
          format: uri
        model:
          type: string
          minLength: 1
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/LLMProviderCapability"
          description: 能力维度列表; 省略 = [chat]
        session_config:
          $ref: "#/components/schemas/GASessionConfig"
        transport_config:
          $ref: "#/components/schemas/ProviderTransportConfig"
        revision:
          type: integer
          format: int64
          minimum: 1
        is_default:
          type: boolean
        state:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MCPServer:
      type: object
      additionalProperties: false
      required: [mcp_server_id, server_key, name, transport, timeout_seconds, enabled, revision, created_at, updated_at]
      properties:
        mcp_server_id: {type: integer, format: int64, minimum: 1}
        server_key: {type: string, pattern: "^[A-Za-z0-9_]{1,32}$"}
        name: {type: string, minLength: 1}
        # transport: http(Streamable HTTP, 默认) | stdio(Worker 沙箱内进程宿主,
        # 主流 mcp.json 兼容, 如 serena)。stdio 调用不经过 proxy, 不参与按调用计量。
        transport: {type: string, enum: [http, stdio]}
        url: {type: string, format: uri, nullable: true}
        # headers 为平台侧持有的凭据头(proxy 注入, worker 快照不含);
        # 回显掩码(只写不读, 值保留前 4 字符 + ***)。stdio 下必须为空。
        headers: {type: object, additionalProperties: {type: string}, nullable: true}
        # command/args: stdio 进程命令与参数(exec.Command 直接执行); http 下恒为空。
        command: {type: string, nullable: true}
        args: {type: array, items: {type: string}, nullable: true}
        isolation: {type: string, enum: [shared, workspace]}
        max_instances: {type: integer, minimum: 1, maximum: 16}
        timeout_seconds: {type: integer, minimum: 1, maximum: 300}
        enabled: {type: boolean}
        revision: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CreateMCPServerRequest:
      type: object
      additionalProperties: false
      required: [server_key, name, transport, timeout_seconds]
      properties:
        server_key: {type: string, pattern: "^[A-Za-z0-9_]{1,32}$"}
        name: {type: string, minLength: 1}
        url: {type: string, format: uri}
        # 凭据头(Authorization/x-api-key 等); 敏感键名(Host 等)拒绝。
        headers: {type: object, additionalProperties: {type: string}}
        transport: {type: string, enum: [http, stdio]}
        # stdio 必填 command(裸命令名或绝对路径), args 可选。
        command: {type: string}
        args: {type: array, items: {type: string}}
        isolation: {type: string, enum: [shared, workspace]}
        max_instances: {type: integer, minimum: 1, maximum: 16}
        timeout_seconds: {type: integer, minimum: 1, maximum: 300}
    UpdateMCPServerRequest:
      type: object
      additionalProperties: false
      required: [server_key, name, transport, timeout_seconds]
      properties:
        server_key: {type: string, pattern: "^[A-Za-z0-9_]{1,32}$"}
        name: {type: string, minLength: 1}
        url: {type: string, format: uri}
        headers: {type: object, additionalProperties: {type: string}}
        transport: {type: string, enum: [http, stdio]}
        # stdio 必填 command(裸命令名或绝对路径), args 可选。
        command: {type: string}
        args: {type: array, items: {type: string}}
        isolation: {type: string, enum: [shared, workspace]}
        max_instances: {type: integer, minimum: 1, maximum: 16}
        timeout_seconds: {type: integer, minimum: 1, maximum: 300}
    # MCPQuotaLimit: 每用户 × 每 server × 周期限额(无行 = 默认放行)。
    MCPQuotaLimit:
      type: object
      additionalProperties: false
      required: [owner_key, server_id, period, limit_count]
      properties:
        owner_key: {type: string, minLength: 1}
        server_id: {type: string, minLength: 1}
        period: {type: string, enum: [day, month]}
        limit_count: {type: integer, format: int64, minimum: 1}
    CreateLLMProviderRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - provider_type
        - base_url
        - model
        - api_key
        - session_config
        - transport_config
      properties:
        name:
          type: string
          minLength: 1
        provider_type:
          $ref: "#/components/schemas/LLMProviderType"
        base_url:
          type: string
          format: uri
        model:
          type: string
          minLength: 1
        api_key:
          type: string
          minLength: 1
          writeOnly: true
          description: Upstream API key; encrypted at rest and never returned
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/LLMProviderCapability"
          description: 能力维度列表; 省略 = [chat]
        session_config:
          $ref: "#/components/schemas/GASessionConfig"
        transport_config:
          $ref: "#/components/schemas/ProviderTransportConfig"
    UpdateLLMProviderRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - provider_type
        - base_url
        - model
        - session_config
        - transport_config
      properties:
        name:
          type: string
          minLength: 1
        provider_type:
          $ref: "#/components/schemas/LLMProviderType"
        base_url:
          type: string
          format: uri
        model:
          type: string
          minLength: 1
        api_key:
          type: string
          writeOnly: true
          description: Optional; omitted or blank preserves the stored key
        session_config:
          $ref: "#/components/schemas/GASessionConfig"
        transport_config:
          $ref: "#/components/schemas/ProviderTransportConfig"
