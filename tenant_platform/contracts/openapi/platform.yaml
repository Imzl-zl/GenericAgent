openapi: 3.1.0
info:
  title: GenericAgent Tenant Platform Foundation API
  version: 0.1.0
  description: >
    Loopback foundation HTTP contract for session tasks. X-Platform-Dev-Token is
    required for this foundation-only API. No browser chat endpoint is exposed;
    the P0 user chat path remains BotTransportAdapter.
servers:
  - url: http://127.0.0.1:8080
    description: Local loopback foundation backend
security:
  - PlatformDevToken: []
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [ok]
                    example: ok
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/sessions/{session_key}/tasks:
    post:
      operationId: createTask
      summary: Accept a task for the given session
      parameters:
        - $ref: "#/components/parameters/SessionKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskEnvelope"
      responses:
        "202":
          description: Task accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - task_id
                  - status
                properties:
                  task_id:
                    type: string
                  status:
                    type: string
                    enum: [queued]
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/tasks/{task_id}:
    get:
      operationId: getTask
      summary: Read task status and opaque result references
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task status envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/tasks/{task_id}/result:
    get:
      operationId: getTaskResult
      summary: Read the bounded committed result by opaque result_ref
      description: >
        Returns the committed result payload identified by an opaque result_ref
        and its matching digest. Host filesystem paths are never accepted.
        result_ref is optional; when omitted the platform resolves the result
        for the given task_id.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - name: result_ref
          in: query
          required: false
          schema:
            type: string
          description: Opaque committed result reference (never a host path)
      responses:
        "200":
          description: Committed result payload and digest
          content:
            application/json:
              schema:
                type: object
                required:
                  - result_ref
                  - result_digest
                  - content_type
                  - payload
                properties:
                  result_ref:
                    type: string
                  result_digest:
                    type: string
                  content_type:
                    type: string
                    description: MIME type of the committed result body
                    example: text/plain; charset=utf-8
                  payload:
                    type: string
                    description: >
                      UTF-8 text of the committed result body. The digest in
                      result_digest is sha256 over these exact UTF-8 bytes.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/tasks/{task_id}/cancel:
    post:
      operationId: cancelTask
      summary: Request cooperative task cancellation
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Cancellation acceptance and current status
          content:
            application/json:
              schema:
                type: object
                required:
                  - accepted
                  - status
                properties:
                  accepted:
                    type: boolean
                  status:
                    type: string
                    enum: [queued, starting, running, succeeded, failed, cancelled, interrupted]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/users:
    post:
      operationId: adminCreateUser
      summary: Create a pending platform user (admin-only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created in pending state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRecord"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/users/{user_id}/approve:
    post:
      operationId: adminApproveUser
      summary: Approve a pending user (pending → approved)
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRecord"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/users/{user_id}/block:
    post:
      operationId: adminBlockUser
      summary: Block a user (approved → blocked); cancels queued/running tasks
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRecord"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/users/pending:
    get:
      operationId: adminListPendingUsers
      summary: List users in pending state
      responses:
        "200":
          description: Pending users
          content:
            application/json:
              schema:
                type: object
                required:
                  - users
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/admin/bots:
    post:
      operationId: adminCreateBot
      summary: Register a WeChat/iLink bot for a platform user
      description: >
        Stores the upstream bot token encrypted at rest. The plaintext token
        is returned to the caller only once (from iLink); the platform never
        persists or logs it in plaintext.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBotRequest"
      responses:
        "201":
          description: Bot registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotRecord"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/bindings:
    post:
      operationId: createBinding
      summary: Generate a one-time WeChat binding code for a user
      description: >
        Returns the plaintext code ONCE; only its SHA-256 hash is persisted.
        The code expires after a short TTL (default 10 minutes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBindingRequest"
      responses:
        "201":
          description: Binding code generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingCode"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/activate:
    post:
      operationId: activateBinding
      summary: Activate a binding code and pair a bot with an ilink user
      description: >
        HTTP equivalent of the /activate bot command (spec §6.2). Consumes
        the one-time code atomically and binds the bot to the ilink_user_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateRequest"
      responses:
        "200":
          description: Binding activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingRecord"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/router/messages:
    post:
      operationId: routerMessage
      summary: Ingest one bot message through the router pipeline
      description: >
        Processes identity resolution, user status check, command parsing
        (/stop, /new, /activate), and task routing. Replies are sent via
        the BotTransportAdapter; the HTTP response carries the action
        classification for observability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouterMessage"
      responses:
        "200":
          description: Message processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/admin/commands:
    get:
      tags: [admin]
      summary: List all platform commands (admin-configurable)
      security: [{PlatformDevToken: []}]
      responses:
        "200":
          description: Command list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PlatformCommand"}
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/commands/{command_id}:
    put:
      tags: [admin]
      summary: Update a platform command (enable/disable, reclassify, edit help)
      security: [{PlatformDevToken: []}]
      parameters:
        - name: command_id
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateCommandRequest"}
      responses:
        "200":
          description: Updated command
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlatformCommand"}
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/tool-policies:
    get:
      tags: [admin]
      summary: List all tool policies
      security: [{PlatformDevToken: []}]
      responses:
        "200":
          description: Policy list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ToolPolicy"}
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [admin]
      summary: Create a new tool policy version
      security: [{PlatformDevToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateToolPolicyRequest"}
      responses:
        "201":
          description: Created policy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ToolPolicy"}
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    PlatformDevToken:
      type: apiKey
      in: header
      name: X-Platform-Dev-Token
      description: Required foundation-only loopback development token
  parameters:
    SessionKey:
      name: session_key
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    ValidationError:
      description: Client-side validation failure (e.g. prompt too long, unknown source)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid X-Platform-Dev-Token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Task or result not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current task state (e.g. result_ref mismatch)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - message
        - trace_id
      properties:
        code:
          type: string
          description: Stable machine-readable error code
          example: SUBMIT_FAILED
        message:
          type: string
          description: Human-readable error message
        trace_id:
          type: string
          description: Correlation trace id for debugging
    TaskEnvelope:
      type: object
      required:
        - message_id
        - source_instance_id
        - prompt
        - source
        - persona_snapshot
        - tool_policy_version
      properties:
        message_id:
          type: string
        source_instance_id:
          type: string
        prompt:
          type: string
        source:
          type: string
          enum: [wechat, web]
        persona_snapshot:
          type: array
          items:
            type: string
        tool_policy_version:
          type: string
        task_id:
          type: string
          description: Ignored on submit; platform assigns task_id
        session_key:
          type: string
          description: Ignored on submit; derived from path
        requester_user_id:
          type: integer
          format: int64
          description: Ignored on submit; derived from bootstrapped dev context
    TaskStatus:
      type: object
      required:
        - task_id
        - session_key
        - status
      properties:
        task_id:
          type: string
        session_key:
          type: string
        status:
          type: string
          enum: [queued, starting, running, succeeded, failed, cancelled, interrupted]
        snapshot_id:
          type: string
        snapshot_checksum:
          type: string
        result_ref:
          type: string
          description: Opaque committed result reference; never a host path
        result_digest:
          type: string
        terminal_error:
          type:
            - object
            - "null"
          properties:
            code:
              type: string
            user_message:
              type: string
            trace_id:
              type: string
    CreateUserRequest:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          description: Platform username (1-64 bytes)
    UserRecord:
      type: object
      required:
        - user_id
        - username
        - status
        - created_at
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        status:
          type: string
          enum: [pending, approved, blocked]
        created_at:
          type: string
          format: date-time
        approved_at:
          type: string
          format: date-time
          nullable: true
    CreateBotRequest:
      type: object
      required:
        - owner_id
        - bot_uuid
        - token
      properties:
        owner_id:
          type: integer
          format: int64
          minimum: 1
        bot_uuid:
          type: string
          format: uuid
        token:
          type: string
          description: Upstream iLink bot token; encrypted at rest by the platform
    BotRecord:
      type: object
      required:
        - bot_id
        - bot_uuid
        - owner_id
        - state
        - created_at
      properties:
        bot_id:
          type: integer
          format: int64
        bot_uuid:
          type: string
          format: uuid
        owner_id:
          type: integer
          format: int64
        state:
          type: string
          enum: [active, expired, revoked]
        created_at:
          type: string
          format: date-time
    CreateBindingRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 1
    BindingCode:
      type: object
      required:
        - code
        - binding_id
        - user_id
        - state
        - expires_at
      properties:
        code:
          type: string
          description: One-time plaintext binding code; returned ONCE, never persisted
        binding_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        state:
          type: string
          enum: [requested, qr_pending, awaiting_activation, active, expired, revoked]
        expires_at:
          type: string
          format: date-time
    ActivateRequest:
      type: object
      required:
        - code
        - bot_uuid
        - ilink_user_id
      properties:
        code:
          type: string
          description: One-time binding code (plaintext)
        bot_uuid:
          type: string
          format: uuid
        ilink_user_id:
          type: string
          description: External IM user id to bind to the bot
    BindingRecord:
      type: object
      required:
        - binding_id
        - user_id
        - state
      properties:
        binding_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        state:
          type: string
          enum: [requested, qr_pending, awaiting_activation, active, expired, revoked]
        activated_at:
          type: string
          format: date-time
          nullable: true
    RouterMessage:
      type: object
      required:
        - bot_uuid
        - ilink_user_id
        - message_id
        - text
      properties:
        bot_uuid:
          type: string
          format: uuid
        ilink_user_id:
          type: string
        message_id:
          type: string
          description: Transport-unique message id for idempotency
        text:
          type: string
          description: Message text; may be a command (/stop, /new, /activate) or normal text
    RouterResult:
      type: object
      required:
        - action
        - reply
      properties:
        action:
          type: string
          enum: [activated, stopped, new_session, task_created, rejected, duplicate, no_running_task, help, status, model_info]
        reply:
          type: string
          description: Reply text sent to the user via the transport
        user_id:
          type: integer
          format: int64
          nullable: true
    PlatformCommand:
      type: object
      required:
        - id
        - command
        - action
        - handler
        - enabled
      properties:
        id:
          type: integer
          format: int64
        command:
          type: string
          example: "/stop"
        action:
          type: string
          enum: [intercept, passthrough]
        handler:
          type: string
          example: "stop"
        help_text:
          type: string
        enabled:
          type: boolean
        sort_order:
          type: integer
        updated_at:
          type: string
          format: date-time
    UpdateCommandRequest:
      type: object
      required:
        - action
        - enabled
      properties:
        action:
          type: string
          enum: [intercept, passthrough]
        help_text:
          type: string
        enabled:
          type: boolean
        sort_order:
          type: integer
    ToolPolicy:
      type: object
      required:
        - id
        - version
        - allowed_tools
        - enabled
      properties:
        id:
          type: integer
          format: int64
        version:
          type: string
          example: "foundation.no-host-tools.v1"
        allowed_tools:
          type: array
          items:
            type: string
          example: ["update_working_checkpoint"]
        description:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateToolPolicyRequest:
      type: object
      required:
        - version
        - allowed_tools
      properties:
        version:
          type: string
          example: "foundation.code-run.v1"
        allowed_tools:
          type: array
          items:
            type: string
          example: ["update_working_checkpoint", "code_run", "file_read"]
        description:
          type: string
